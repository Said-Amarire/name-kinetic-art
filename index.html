<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">AMARIRE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <button type="button" id="triggerBtn" class="trigger-btn">Try Your Name</button>

  <div id="modalOverlay" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button type="button" id="closeBtn" class="close-btn" aria-label="Close">&times;</button>
      <h2 class="modal-title">Enter Your Name</h2>
      <form id="nameForm" class="modal-form">
        <input
          type="text"
          id="nameInput"
          class="name-input"
          placeholder="e.g. Amarire ..."
          maxlength="24"
          autocomplete="off"
          spellcheck="false"
          required
        >
        <button type="submit" class="apply-btn">Apply</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
